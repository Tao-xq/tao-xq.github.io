<!doctype html>
<html lang="zh-CN" data-panel="home"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><meta name="description" content="Rest Mode，海边的 ACGN 闲谈与日常随笔。"><title>Rest Mode · 窗边与沙滩</title><link rel="stylesheet" href="vendor/quill.snow.css"><link rel="stylesheet" href="community.css"><link rel="stylesheet" href="avatar-styles.css"><script defer src="content/ui-languages.js"></script><script defer src="i18n.js"></script><script defer src="content/generated.js"></script><script defer src="vendor/quill.js"></script><script defer src="home-manifest.js"></script><script defer src="vendor/supabase.js"></script><script defer src="api-client.js"></script><script defer src="avatars.js"></script><script defer src="community.js"></script><script defer src="home-animation.js"></script></head>
<body>
<script src="config.js"></script><script src="translation-client.js"></script>
<main id="home" aria-label="海边窗景主页"><div id="stage" class="stage"><canvas id="scene" width="1585" height="992" role="img" aria-label="女主在窗边看书，小猫与海鸥轻轻活动"></canvas><div id="hotspots"></div><p id="loading" role="status">正在打开窗景…</p></div><div class="home-caption"><span>Rest Mode</span><p><span id="home-hint">点开书柜，翻翻大家留下的故事。</span><br><small>ACGN Notes · Daily Notes</small></p><div class="home-tools"><div data-language-picker></div><a href="#/community">打开书柜 ↗</a></div></div></main>
<div class="animation-controls" hidden aria-hidden="true"><button id="play-toggle">暂停</button><button id="page-turn">看翻页</button><button id="cat-yawn">看哈欠</button><button id="compare-toggle">对照原图</button><button id="inspect-toggle">逐帧查看</button><p id="live-status"></p><section id="inspector" hidden><select id="sequence"><option value="hero-reading">静止</option></select><img id="frame-image" alt=""><a id="frame-download"></a><input id="frame-slider" type="range"><output id="frame-label"></output><div id="frame-thumbnails"></div><button id="prev-frame">上一帧</button><button id="next-frame">下一帧</button></section></div>
<section id="community-panel" hidden aria-label="书柜内容界面"><div id="page-content"></div></section>
<div id="tide" class="tide" hidden aria-hidden="true"><svg viewBox="0 0 1440 1100" preserveAspectRatio="none"><path class="tide-body" d="M-20 70 Q80 24 162 60 T330 53 T500 63 T690 47 T890 61 T1080 49 T1270 62 T1460 41 L1460 1120 H-20Z"/><path class="tide-foam" d="M-20 70 Q80 24 162 60 T330 53 T500 63 T690 47 T890 61 T1080 49 T1270 62 T1460 41"/><path class="tide-line" d="M-20 143 Q90 117 180 150 T380 139 T600 151 T810 140 T1050 148 T1250 131 T1460 150"/></svg></div>
<dialog id="crop-dialog" aria-labelledby="crop-title"><form method="dialog" class="crop-form"><div class="dialog-head"><h2 id="crop-title">裁一张 A4 封面</h2><button value="cancel" class="icon-button" aria-label="取消裁剪">×</button></div><p class="muted">拖动图片调整位置，也可以用下方滑杆。比例固定为 210 : 297。</p><canvas id="crop-canvas" width="420" height="594" aria-label="封面裁剪预览"></canvas><div class="crop-sliders"><label>缩放 <input id="crop-zoom" type="range" min="1" max="3" step=".01" value="1"></label><label>左右 <input id="crop-x" type="range" min="0" max="100" value="50"></label><label>上下 <input id="crop-y" type="range" min="0" max="100" value="50"></label></div><div class="dialog-actions"><button value="cancel" class="paper-button">取消</button><button id="crop-confirm" value="confirm" class="paper-button primary">使用这张封面</button></div></form></dialog>
<dialog id="link-dialog" aria-labelledby="link-title"><form id="link-form"><div class="dialog-head"><h2 id="link-title">插入链接</h2><button type="button" class="icon-button" data-close-dialog="link-dialog" aria-label="关闭链接窗口">×</button></div><label>链接地址<input name="url" type="url" required placeholder="https://…"></label><button type="submit" class="paper-button primary">插入</button></form></dialog>
<dialog id="preview-dialog" aria-labelledby="preview-title"><div class="dialog-head"><h2 id="preview-title">发布前再看一眼</h2><button class="icon-button" data-close-dialog="preview-dialog" aria-label="关闭文章预览">×</button></div><article id="draft-preview" class="article-content"></article></dialog>
<dialog id="entrance-dialog"><form method="dialog"><button class="icon-button" aria-label="关闭">×</button><h2 id="entrance-title"></h2><p id="entrance-copy"></p><button class="paper-button">回到窗边</button></form></dialog>
<div id="toast" role="status" aria-live="polite" hidden></div>
<dialog id="note-dialog" aria-labelledby="note-dialog-title"><form id="note-form"><div class="dialog-head"><h2 id="note-dialog-title">写一条留言</h2><button type="button" class="icon-button" data-close-dialog="note-dialog" aria-label="关闭">×</button></div><label class="field"><span>你的昵称</span><input id="note-author" name="author" maxlength="24" autocomplete="nickname" required></label><div data-avatar-editor></div><label class="field"><span>留言内容 <small id="note-counter">0 / 280</small></span><textarea id="note-body" name="body" rows="5" maxlength="560" placeholder="想在这里留下一点什么？" required></textarea></label><p class="muted">发布后所有访客都能看到。清除浏览器数据会失去匿名帖的编辑权限。</p><div class="dialog-actions"><button type="button" class="paper-button" data-close-dialog="note-dialog">取消</button><button type="submit" id="note-submit" class="paper-button primary">留下留言</button></div></form></dialog>
<noscript>需要启用 JavaScript 才能打开书柜、搜索与写作。</noscript>
</body></html>
